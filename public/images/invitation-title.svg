    <path d="M -330 -430 C -230 -200, -180 70, 30 120 C 170 150, 130 -50, -40 -10 C -150 20, -60 160, 170 150 S 820 60, 1220 110 S 1900 180, 2420 90 S 3020 40, 3350 110" fill="none" stroke="url(#ribbon)" stroke-width="13" stroke-linecap="round" opacity="0.92"/>
