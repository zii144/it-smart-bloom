    <g opacity="0.45">
      <path transform="translate(0,0) scale(1,-1)" fill="url(#goldWashA)" d="M360 435C356 279 349 211 333 196C327 191 320 189 307 189C291 189 256 190 236 192C258 276 261 361 261 433V435ZM116 647V433C116 263 109 63 15 -93L22 -100C145 -24 205 80 234 185V180C265 171 282 159 294 141C306 123 308 92 308 53C361 53 398 64 428 86C476 122 488 191 494 413C514 416 526 423 533 431L418 527L351 463H261V619H517C529 465 556 321 616 193C550 91 461 -3 346 -73L353 -84C483 -40 586 25 667 101C694 59 725 20 762 -16C808 -61 905 -112 963 -61C984 -43 978 -4 939 67L966 246L957 249C935 204 902 147 884 121C872 104 864 104 850 119C818 147 791 178 768 213C827 293 871 378 904 462C930 461 939 469 943 481L760 543C746 482 727 419 701 356C674 437 661 527 655 619H943C958 619 969 624 972 635C942 661 900 694 871 716C905 762 875 849 697 828L690 822C724 794 763 744 777 698C784 694 791 692 798 690L764 647H654C651 701 651 755 652 808C678 812 687 824 688 837L509 854C509 784 511 715 515 647H282L116 703Z"/>
      <path transform="translate(2080,0) scale(1,-1)" fill="url(#goldWashB)" d="M292 628V756H760V628ZM542 567 379 581V458H291L292 514V600H760V563L613 576V458H515V545C535 548 541 556 542 567ZM824 542 762 458H747V540C767 543 774 550 775 561H784C828 561 899 582 900 588V733C921 738 934 747 940 755L811 851L750 784H313L145 840V513C145 313 136 90 21 -87L29 -93C180 3 245 134 272 267H333V103C333 82 327 71 285 48L363 -103C370 -99 377 -94 384 -86C480 -16 557 53 594 89L592 98L469 69V267H553C603 55 707 -34 874 -98C890 -28 928 19 985 35L986 47C891 59 798 79 722 118C777 132 833 147 876 161C899 156 909 161 915 170L784 267H952C966 267 977 272 980 283C934 326 856 391 856 391L786 295H747V430H906C921 430 931 435 934 446C893 485 824 542 824 542ZM277 295C285 341 289 386 291 430H379V295ZM678 144C634 175 597 215 571 267H767C746 234 711 185 678 144ZM613 295H515V430H613Z"/>
